name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format fonts-noto-cjk
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Generate documentation
        run: python scripts/generate_site.py
      - name: Check content
        run: python scripts/check_content.py
      - name: Compile C++ snippets
        run: python scripts/check_cpp.py
      - name: Check links and mirrored images
        run: python scripts/check_links.py
      - name: Check source rendering
        run: python scripts/check_rendering.py
      - name: Build site
        run: mkdocs build --strict
      - name: Check generated and browser rendering
        run: >-
          python scripts/check_rendering.py
          --site-dir site
          --browser
          --screenshots-dir "$RUNNER_TEMP/hautoj-rendering"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
